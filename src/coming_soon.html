<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon · My Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #faf9f8;
      background-image: radial-gradient(circle at 30% 10%, rgba(230, 240, 255, 0.7) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(235, 225, 245, 0.6) 0%, transparent 45%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e1e2f;
      line-height: 1.5;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 4px 18px rgba(0, 0, 0, 0.02);
      border-radius: 2.5rem;
      padding: 3.5rem 2.5rem;
      max-width: 680px;
      width: 100%;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.005);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #eaeef9;
      color: #2d3b5e;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 2rem;
      border: 1px solid rgba(70, 100, 180, 0.1);
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #1e1e2f 0%, #3a3a5a 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .highlight {
      position: relative;
      display: inline-block;
    }

    .highlight::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0.1em;
      width: 100%;
      height: 0.2em;
      background: rgba(180, 200, 255, 0.5);
      border-radius: 4px;
      z-index: -1;
    }

    .subhead {
      font-size: 1.2rem;
      font-weight: 400;
      color: #4a4a6a;
      max-width: 420px;
      margin: 0 auto 2.25rem auto;
      padding: 0 0.5rem;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      color: #a0a0b8;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    .divider-line {
      height: 1px;
      width: 50px;
      background: #d0d0e0;
      border-radius: 2px;
    }

    .progress-container {
      width: 80%;
      max-width: 320px;
      height: 6px;
      background: #e4e4ee;
      border-radius: 20px;
      margin: 0 auto 2rem auto;
      overflow: hidden;
    }

    .progress-fill {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, #8899d4, #6c7fc0);
      border-radius: 20px;
      animation: subtlePulse 2.5s infinite alternate ease-in-out;
    }

    @keyframes subtlePulse {
      0% { opacity: 0.8; width: 68%; }
      100% { opacity: 1; width: 72%; }
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #3b3b5c;
      background: #ffffffcc;
      border: 1px solid #e2e2f0;
      backdrop-filter: blur(4px);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transition: all 0.2s ease;
      text-decoration: none;
      font-size: 1.3rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .social-link:hover {
      background: #ffffff;
      border-color: #b0b8e0;
      color: #1e1e3a;
      transform: translateY(-3px);
      box-shadow: 0 12px 20px -10px rgba(80, 100, 180, 0.3);
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #8888a0;
      letter-spacing: 0.2px;
    }

    .footer-note span {
      font-weight: 500;
      color: #5e5e7a;
    }

    /* simple responsive */
    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem;
        border-radius: 2rem;
      }

      .subhead {
        font-size: 1rem;
      }

      .social-link {
        width: 44px;
        height: 44px;
      }

      .social-link svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
